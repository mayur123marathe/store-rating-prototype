services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: roxiler_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: roxiler_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roxiler_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roxiler_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/roxiler_db?schema=public
      JWT_SECRET: supersecretjwtkey_roxiler_system_2026_secure_token
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && npx tsx prisma/seed.ts && node dist/server.js"

  # Frontend Web App Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roxiler_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
